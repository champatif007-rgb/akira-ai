<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akira AI - Study Assistant</title>
<style>
:root{--bg:#eceef3;--panel:#fff;--ink:#14161f;--muted:#5d6477;--line:#d5d9e3;--red:#e8322b;--onred:#fff;--soft:#f6f7fa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--panel:#1b1e29;--ink:#eef0f6;--muted:#9aa2b8;--line:#2d3243;--red:#ff4a3f;--onred:#12141c;--soft:#161924}}
:root[data-theme="dark"]{--bg:#12141c;--panel:#1b1e29;--ink:#eef0f6;--muted:#9aa2b8;--line:#2d3243;--red:#ff4a3f;--onred:#12141c;--soft:#161924}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16.5px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;display:flex;flex-direction:column}
h1,h2,h3{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.1;margin:0;letter-spacing:-.02em}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button{font-family:inherit}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1.5px solid var(--ink);background:var(--panel)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:23px;font-family:"Trebuchet MS",system-ui,sans-serif}
.dot{width:18px;height:18px;border-radius:50%;background:var(--red);flex:none}
.sp{flex:1}
.ib{font:600 14.5px inherit;font-family:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.ib:hover{background:var(--soft)}
#menu{display:none}
.shell{flex:1;min-height:0;display:grid;grid-template-columns:290px 1fr}
.side{background:var(--soft);border-right:1.5px solid var(--ink);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.btn{font:600 16px inherit;font-family:inherit;background:var(--red);color:var(--onred);border:0;border-radius:999px;padding:11px 20px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.side h3{font-size:13.5px;margin-bottom:6px;font-family:inherit;font-weight:700;color:var(--muted)}
.chats{display:flex;flex-direction:column;gap:4px;max-height:170px;overflow-y:auto}
.chat{display:flex;align-items:center;gap:4px}
.chat button.t{flex:1;text-align:left;font:500 14.5px inherit;font-family:inherit;color:var(--ink);background:transparent;border:1.5px solid transparent;border-radius:10px;padding:6px 10px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat.on button.t{background:var(--panel);border-color:var(--line)}
.chat button.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 6px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mode{font:600 14px inherit;font-family:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:9px 8px;cursor:pointer;text-align:center}
.mode[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sw{display:flex;gap:9px;font-size:14px;line-height:1.35;cursor:pointer;align-items:flex-start}
.sw input{width:17px;height:17px;margin-top:2px;accent-color:var(--red);flex:none}
.main{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.msgs{flex:1;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.m{max-width:min(760px,88%);padding:11px 16px;border-radius:18px;line-height:1.55;word-wrap:break-word;font-size:16px}
.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px;white-space:pre-wrap}
.a{align-self:flex-start;background:var(--soft);border:1px solid var(--line);border-bottom-left-radius:4px}
.tx{white-space:pre-wrap}
.pic{display:block;width:100%;max-width:560px;height:auto;margin:10px 0;border:1px solid var(--line);border-radius:14px;background:#fff}
.tbl{overflow-x:auto;margin:10px 0}.tbl table{border-collapse:collapse;font-size:14.5px;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 11px;text-align:left}.tbl th{background:var(--ink);color:var(--bg)}
.acts{display:flex;gap:6px;margin-top:8px}
.acts button{font:600 12.5px inherit;font-family:inherit;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer}
.acts button:hover{color:var(--ink);border-color:var(--ink)}
.dots span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:4px;animation:p 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
.welcome{margin:auto;max-width:640px;text-align:center}
.welcome h1{font-size:clamp(30px,5vw,46px);font-weight:800;margin-bottom:10px}
.welcome p{color:var(--muted);margin:0 0 20px}
.starts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{font:500 14.5px inherit;font-family:inherit;background:var(--soft);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:8px 15px;cursor:pointer}
.chip:hover{border-color:var(--red)}
.feats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.feats span{font-size:13.5px;border:1.5px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:500}
.compose{display:flex;gap:8px;padding:12px 18px;border-top:1.5px solid var(--ink);align-items:flex-end;background:var(--panel)}
.compose textarea{flex:1;resize:none;font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1.5px solid var(--line);border-radius:16px;padding:11px 14px;min-height:46px;max-height:140px;line-height:1.4}
.mic{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;font-size:18px;flex:none}
.mic.on{background:var(--red);color:var(--onred);border-color:var(--red)}
.note{font-size:12.5px;color:var(--muted);padding:0 18px 10px;text-align:center}
.hide{display:none!important}
@media (max-width:820px){
#menu{display:inline-block}
.shell{grid-template-columns:1fr;position:relative}
.side{position:absolute;inset:0 18% 0 0;z-index:5;transform:translateX(-102%);transition:transform .2s;box-shadow:6px 0 0 var(--red)}
.side.open{transform:none}
.m{max-width:94%}.msgs{padding:16px 12px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}.dots span{animation:none}}
</style>
</head>
<body>
<header class="top">
<button class="ib" id="menu" aria-label="Open menu">Menu</button>
<div class="logo"><span class="dot"></span><span id="brand">Akira AI</span></div>
<div class="sp"></div>
<button class="ib" id="timer" title="Focus timer: 25 minutes">Focus 25:00</button>
<button class="ib" id="theme" aria-label="Switch light or dark">Theme</button>
</header>

<div class="shell">
<aside class="side" id="side">
<button class="btn" id="new">+ New chat</button>
<div><h3>Your chats</h3><div class="chats" id="chats"></div></div>
<div><h3>What do you need?</h3><div class="modes" id="modes">
<button class="mode" data-m="help" aria-pressed="true">Homework</button>
<button class="mode" data-m="explain" aria-pressed="false">Explain</button>
<button class="mode" data-m="quiz" aria-pressed="false">Quiz me</button>
<button class="mode" data-m="write" aria-pressed="false">Writing</button>
<button class="mode" data-m="plan" aria-pressed="false">Planner</button>
<button class="mode" data-m="draw" aria-pressed="false">Draw</button></div></div>
<div class="row2">
<div><h3><label for="grade">Level</label></h3><select id="grade"><option>Grades 1 to 3</option><option>Grades 4 to 6</option><option selected>Grades 7 to 9</option><option>Grades 10 to 12</option><option>College</option></select></div>
<div><h3><label for="subj">Subject</label></h3><select id="subj"><option>Any subject</option><option>Math</option><option>Science</option><option>English</option><option>Hindi</option><option>Social science</option><option>Computer science</option></select></div></div>
<div><h3><label for="lang">Answer language</label></h3><select id="lang"><option value="auto">Same as my question</option><option value="en">English</option><option value="hi">Hindi</option><option value="hinglish">Hinglish</option></select></div>
<label class="sw"><input type="checkbox" id="guide" checked><span>Guide me with hints. Turn off for full answers.</span></label>
<label class="sw"><input type="checkbox" id="vis" checked><span>Add pictures, diagrams and tables when they help.</span></label>
<button class="ib" id="export">Save this chat as a file</button>
</aside>

<main class="main">
<div class="msgs" id="msgs" aria-live="polite"></div>
<form class="compose" id="form">
<button type="button" class="mic" id="mic" aria-label="Speak your question">&#127908;</button>
<textarea id="inp" rows="1" placeholder="Ask Akira anything about your studies" aria-label="Your question"></textarea>
<button class="btn" id="send" type="submit">Ask</button>
</form>
<div class="note">Akira can make mistakes. Check important answers with your teacher or textbook.</div>
</main>
</div>

<script>
var BRAND="Akira AI"; // change this to rename the site
document.getElementById("brand").textContent=BRAND;document.title=BRAND+" - Study Assistant";
var $=function(i){return document.getElementById(i)},box=$("msgs");
var STARTS={
help:["Help me solve 3x + 5 = 20","How do I start an essay on pollution?","Check my science project idea"],
explain:["Explain photosynthesis simply","Why do we have seasons?","What is a fraction?"],
quiz:["Quiz me on fractions","Quiz me on the solar system","Quiz me on the Mughal Empire"],
write:["Give feedback on my paragraph","How can I make my intro stronger?","Help me fix my grammar"],
plan:["Plan my math exam revision for 1 week","How do I study for a history test?","Make a daily homework routine"],
draw:["Draw the water cycle with labels","Flowchart of how a bill becomes a law","Mind map about the solar system","Table of the planets and their sizes"]};
var chats=[],cur=null,mode="help",busy=false;
function store(){try{localStorage.setItem("akira_chats",JSON.stringify(chats.slice(0,30)))}catch(e){}}
function loadStore(){try{chats=JSON.parse(localStorage.getItem("akira_chats")||"[]")}catch(e){chats=[]}}
function newChat(){cur={id:Date.now(),title:"New chat",msgs:[]};chats.unshift(cur);renderList();welcome()}
function renderList(){var c=$("chats");c.innerHTML="";chats.forEach(function(ch){
var d=document.createElement("div");d.className="chat"+(ch===cur?" on":"");
var t=document.createElement("button");t.className="t";t.textContent=ch.title;t.onclick=function(){cur=ch;renderList();welcome();$("side").classList.remove("open")};
var x=document.createElement("button");x.className="x";x.textContent="\u00d7";x.setAttribute("aria-label","Delete chat");x.onclick=function(){chats=chats.filter(function(k){return k!==ch});if(cur===ch)cur=chats[0]||null;if(!cur)newChat();else{renderList();welcome()}store()};
d.appendChild(t);d.appendChild(x);c.appendChild(d)})}

function addTx(el,t){t=t.trim();if(!t)return;var d=document.createElement("div");d.className="tx";d.textContent=t;el.appendChild(d)}
function addBlock(el,kind,code){
if(kind==="svg"){var s=code.trim();if(!/^<svg[\s>]/i.test(s)||s.length>40000)return;
s=s.replace(/<script[\s\S]*?<\/script>/gi,"").replace(/\son\w+="[^"]*"/gi,"");
if(!/xmlns=/.test(s))s=s.replace(/^<svg/i,'<svg xmlns="http://www.w3.org/2000/svg"');
var img=new Image();img.className="pic";img.alt="Picture drawn by Akira";img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);el.appendChild(img);return}
var rows=code.trim().split("\n").filter(function(r){return r.replace(/[\s|:-]/g,"")});if(!rows.length)return;
var w=document.createElement("div");w.className="tbl";var t=document.createElement("table");
rows.forEach(function(r,i){var tr=document.createElement("tr");r.trim().replace(/^\||\|$/g,"").split("|").forEach(function(c){var td=document.createElement(i?"td":"th");td.textContent=c.trim();tr.appendChild(td)});t.appendChild(tr)});
w.appendChild(t);el.appendChild(w)}
function plain(text){return text.replace(/```(svg|table)[\s\S]*?```/g,"")}
function rich(el,text){el.textContent="";var re=/```(svg|table)\s*\n([\s\S]*?)```/g,last=0,m;
while((m=re.exec(text))){addTx(el,text.slice(last,m.index));addBlock(el,m[1],m[2]);last=re.lastIndex}
var tail=text.slice(last),o=tail.indexOf("```");addTx(el,o>=0?tail.slice(0,o):tail);if(!el.firstChild)el.textContent="...";
var a=document.createElement("div");a.className="acts";
var l=document.createElement("button");l.textContent="Listen";l.onclick=function(){speak(plain(text))};
var c=document.createElement("button");c.textContent="Copy";c.onclick=function(){try{navigator.clipboard.writeText(plain(text));c.textContent="Copied"}catch(e){}setTimeout(function(){c.textContent="Copy"},1500)};
a.appendChild(l);a.appendChild(c);el.appendChild(a)}
function bubble(cls,txt){var d=document.createElement("div");d.className="m "+cls;if(txt)d.textContent=txt;box.appendChild(d);box.scrollTop=box.scrollHeight;return d}
function welcome(){box.innerHTML="";
if(cur&&cur.msgs.length){cur.msgs.forEach(function(m){var b=bubble(m.role==="user"?"u":"a","");if(m.role==="user")b.textContent=m.text;else rich(b,m.text)});box.scrollTop=box.scrollHeight;return}
var w=document.createElement("div");w.className="welcome";
w.innerHTML="<h1>What are we learning today?</h1><p>Ask anything, or pick a starter. Akira explains step by step.</p><div class='starts'></div><div class='feats'><span>Hints first</span><span>Diagrams &amp; tables</span><span>Voice &amp; listen</span><span>Hindi &amp; English</span><span>Quizzes</span></div>";
STARTS[mode].forEach(function(s){var b=document.createElement("button");b.type="button";b.className="chip";b.textContent=s;b.onclick=function(){ask(s)};w.querySelector(".starts").appendChild(b)});box.appendChild(w)}

async function ask(text){
text=(text||"").trim();if(!text||busy)return;
busy=true;$("send").disabled=true;
if(box.querySelector(".welcome"))box.innerHTML="";
cur.msgs.push({role:"user",text:text});if(cur.title==="New chat"){cur.title=text.slice(0,32);renderList()}
bubble("u",text);var out=bubble("a","");out.innerHTML="<span class='dots'><span></span><span></span><span></span></span>";
var payload={mode:mode,grade:$("grade").value,subject:$("subj").value,lang:$("lang").value,guide:$("guide").checked,visuals:$("vis").checked,
messages:cur.msgs.slice(-12).map(function(m){return{role:m.role,text:m.text.replace(/```(svg|table)[\s\S]*?```/g,"[picture shown]")}})};
try{
var res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
var j={};try{j=await res.json()}catch(e){}
if(!res.ok){cur.msgs.pop();out.textContent=res.status===429?"Akira is busy right now. Please wait a minute and try again.":j.error==="not_configured"?"Akira is not set up yet. The site owner needs to add the AI key in Netlify.":j.error==="model"?"The AI model name needs updating by the site owner.":"Something went wrong. Please try again."}
else if(!j.text){cur.msgs.pop();out.textContent="I can't help with that one. Please ask your teacher or a trusted adult."}
else{rich(out,j.text);cur.msgs.push({role:"model",text:j.text});store()}
}catch(e){cur.msgs.pop();out.textContent="Could not connect. Check your internet and try again."}
busy=false;$("send").disabled=false;box.scrollTop=box.scrollHeight;$("inp").focus()}

/* voice */
function speak(t){if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.slice(0,1500));var l=$("lang").value;u.lang=l==="hi"?"hi-IN":"en-IN";speechSynthesis.speak(u)}
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null;
if(!SR)$("mic").classList.add("hide");
$("mic").onclick=function(){if(rec){rec.stop();return}
rec=new SR();rec.lang=$("lang").value==="hi"?"hi-IN":"en-IN";rec.interimResults=false;
rec.onresult=function(e){$("inp").value=e.results[0][0].transcript;$("inp").focus()};
rec.onend=function(){rec=null;$("mic").classList.remove("on")};rec.onerror=function(){rec=null;$("mic").classList.remove("on")};
$("mic").classList.add("on");rec.start()};

/* focus timer */
var tleft=1500,tint=null;
function tshow(){var m=Math.floor(tleft/60),s=tleft%60;$("timer").textContent=(tint?"":"Focus ")+(m<10?"0":"")+m+":"+(s<10?"0":"")+s}
$("timer").onclick=function(){if(tint){clearInterval(tint);tint=null;tleft=1500;tshow();return}
tint=setInterval(function(){tleft--;if(tleft<=0){clearInterval(tint);tint=null;tleft=1500;$("timer").textContent="Break time!";setTimeout(tshow,8000)}else tshow()},1000);tshow()};

/* ui */
$("form").addEventListener("submit",function(e){e.preventDefault();var v=$("inp").value;$("inp").value="";$("inp").style.height="";ask(v)});
$("inp").addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}});
$("inp").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,140)+"px"});
$("modes").addEventListener("click",function(e){var b=e.target.closest(".mode");if(!b)return;mode=b.dataset.m;
document.querySelectorAll(".mode").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});
if(cur&&!cur.msgs.length)welcome();$("side").classList.remove("open")});
$("new").onclick=function(){newChat();$("side").classList.remove("open")};
$("menu").onclick=function(){$("side").classList.toggle("open")};
$("theme").onclick=function(){var r=document.documentElement,d=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");var n=d==="dark"?"light":"dark";r.setAttribute("data-theme",n);try{localStorage.setItem("akira_theme",n)}catch(e){}};
$("export").onclick=function(){if(!cur||!cur.msgs.length)return;var t=cur.msgs.map(function(m){return(m.role==="user"?"Me: ":"Akira: ")+plain(m.text).trim()}).join("\n\n");
var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download="akira-chat.txt";a.click()};
try{var th=localStorage.getItem("akira_theme");if(th)document.documentElement.setAttribute("data-theme",th)}catch(e){}
loadStore();if(chats.length){cur=chats[0];renderList();welcome()}else newChat();
</script>
</body>
</html>
